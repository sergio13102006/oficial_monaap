<div style="text-align: center; padding: 20px 0;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(75, 47, 42, 0.1); margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: #d4a574;"></i>
    </div>

    <h3 style="font-size: 1.5rem; font-weight: 600; color: #111; margin-bottom: 12px;">¿Eliminar Personal?</h3>

    <p style="font-size: 1rem; color: #666; margin-bottom: 28px;">
        Esta acción no se puede deshacer. Toda la información será eliminada permanentemente.
    </p>

    <div class="personal-alert warning" style="text-align: left; max-width: 100%; margin: 0 auto 24px;">
        <i class="fas fa-user" style="font-size: 1.2rem;"></i>
        <div>
            <strong style="font-size: 1.1rem; display: block; margin-bottom: 8px;">{{ personal.nombres }} {{ personal.apellidos }}</strong>
            <span style="display: block; opacity: 0.85; font-size: 0.95rem;"><i class="fas fa-id-card" style="margin-right: 6px;"></i> {{ personal.numero_documento }}</span>
            <span style="display: block; opacity: 0.85; font-size: 0.95rem; margin-top: 4px;"><i class="fas fa-briefcase" style="margin-right: 6px;"></i> {{ personal.get_rol_display }}</span>
            <span style="display: block; opacity: 0.85; font-size: 0.95rem; margin-top: 4px;"><i class="fas fa-envelope" style="margin-right: 6px;"></i> {{ personal.correo }}</span>
        </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 32px;">
        <button type="button" class="personal-btn secondary" style="flex: 1;" data-personal-action="close-modal" data-modal-id="modalEliminarPersonal">
            <i class="fas fa-times"></i> Cancelar
        </button>
        <button type="button" class="personal-btn danger" style="flex: 1; background: #d4a574; border-color: #d4a574; color: white;" data-personal-action="confirm-delete" data-personal-id="{{ personal.id }}">
            <i class="bi bi-trash3"></i> Sí, Eliminar
        </button>
    </div>
</div>
