{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar Usuario - MonApp</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
</head>

<body>

<!-- PARTÍCULAS DE FONDO -->
<div class="login-particles" id="particles"></div>

<div id="loginContainer">
  <div class="login-card">

    <!-- HEADER -->
    <div class="card-header">
      <canvas id="bolaCanvas"></canvas>
      <img src="{% static 'core/IMG/logo_monakeratina.jpg' %}" width="120" alt="Logo">
    </div>

    <!-- BODY -->
    <div class="card-body">

      <div style="text-align:center;margin-bottom:22px;">
        <i class="bi bi-person-fill-exclamation" style="font-size:2.2rem;color:#1f1918;display:block;margin-bottom:8px;"></i>
        <h6 style="font-weight:700;font-size:1.05rem;color:#1f1918;margin-bottom:4px;">¿Olvidaste tu Usuario?</h6>
        <p style="color:#6d5c5c;font-size:13.5px;margin:0;">Ingresa tu correo y te enviaremos tu nombre de usuario</p>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show login-alert" role="alert" data-autoclose="8000">
            <div class="d-flex align-items-start gap-2">
              <div class="flex-grow-1">{{ message }}</div>
              <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
            </div>
            <div class="alert-progress-bar"></div>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" autocomplete="off">
        {% csrf_token %}

        <div class="input-icon-wrapper">
          <i class="bi bi-envelope"></i>
          <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required autofocus>
        </div>

        <button type="submit" class="btn-login">
          <i class="bi bi-send me-2"></i>Enviar Usuario
        </button>
      </form>

      <div class="recovery-links" style="margin-top:16px;">
        <a href="{% url 'core:index' %}?login=1" class="btn-recovery-link" style="color:#1f1918;text-decoration:none;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;">
          <i class="bi bi-arrow-left me-1"></i>Volver al Login
        </a>
      </div>

      <hr style="margin:18px 0 12px;border-color:#ddd;">
      <div style="text-align:center;">
        <small style="color:#6d5c5c;">
          ¿Olvidaste tu contraseña?
          <a href="{% url 'usuarios:recuperar' %}" style="color:#1f1918;font-weight:600;text-decoration:none;">Recupérala aquí</a>
        </small>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'usuarios/js/login.js' %}"></script>
</body>
</html>
