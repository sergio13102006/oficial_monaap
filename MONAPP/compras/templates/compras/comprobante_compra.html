<div class="modal fade" id="modalComprobante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered comprobante-print-dialog">
    <div class="modal-content comprobante-modal">

      <div class="modal-header">
        <h5 class="modal-title">Comprobante</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body comprobante-modal-body">
        <div id="comprobantePreviewBody">
          <div class="comprobante-loading">
            <div class="spinner-border" role="status"></div>
            <p class="mt-3 mb-0">Cargando vista previa...</p>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" id="btnDescargarComprobante">
          <i class="bi bi-download me-1"></i> Descargar
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>

    </div>
  </div>
</div>
