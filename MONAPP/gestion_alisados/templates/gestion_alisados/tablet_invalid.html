{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace no válido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1f1412 0%, #3a2a24 55%, #4a3428 100%);
            color: #fff7ef;
        }
        .tablet-empty {
            width: min(560px, calc(100vw - 24px));
            background: rgba(255,255,255,.95);
            color: #241715;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.28);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="tablet-empty">
        <div class="mb-3 text-warning" style="font-size:3rem;">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="h4 mb-3">Enlace no válido</h1>
        <p class="mb-4">{{ message|default:'El enlace de la tablet ya expiró o no existe.' }}</p>
        <a class="btn btn-dark" href="{{ tablet_wait_url|default:'/' }}">
            <i class="bi bi-arrow-left-circle"></i> Ir a espera
        </a>
        <p class="text-muted small mt-3 mb-0">Pide al PC que genere un nuevo proceso y mantén abierta la pantalla de espera.</p>
    </div>
</body>
</html>
