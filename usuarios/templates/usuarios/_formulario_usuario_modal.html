{% load static %}

<!-- Cargar JavaScript de validaciones -->
<script src="{% static 'usuarios/js/usuarios.js' %}"></script>

<form method="post" id="form-crear-usuario" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    
    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>Errores:</strong>
            <ul style="margin: 8px 0 0 0; padding-left: 20px;">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <div class="row g-3">
        <!-- Tipo de Documento -->
        <div class="col-md-6">
            <label class="form-label">{{ form.tipo_documento.label }} <span class="text-danger">*</span></label>
            <select name="tipo_documento" id="tipo_documento" class="form-control">
                <option value="">Seleccione...</option>
                <option value="tarjeta_identidad">Tarjeta de Identidad</option>
                <option value="cedula">Cédula</option>
                <option value="pasaporte">Pasaporte</option>
                <option value="otro">Otro</option>
            </select>
            <div class="invalid-feedback"></div>
        </div>

        <!-- Documento -->
        <div class="col-md-6">
            <label class="form-label">{{ form.documento.label }} <span class="text-danger">*</span></label>
            <input type="text" name="documento" id="documento" class="form-control" placeholder="Número de documento" inputmode="numeric" pattern="[0-9]+">
            <div class="invalid-feedback"></div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
            <label class="form-label">{{ form.email.label }} <span class="text-danger">*</span></label>
            <input type="email" name="email" id="email" class="form-control" placeholder="correo@ejemplo.com">
            <div class="invalid-feedback"></div>
        </div>

        <!-- Nombre -->
        <div class="col-md-6">
            <label class="form-label">{{ form.first_name.label }} <span class="text-danger">*</span></label>
            <input type="text" name="first_name" id="first_name" class="form-control" placeholder="Nombre" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+">
            <div class="invalid-feedback"></div>
        </div>

        <!-- Apellido -->
        <div class="col-md-6">
            <label class="form-label">{{ form.last_name.label }} <span class="text-danger">*</span></label>
            <input type="text" name="last_name" id="last_name" class="form-control" placeholder="Apellido" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+">
            <div class="invalid-feedback"></div>
        </div>

        <!-- Contraseña -->
        <div class="col-md-6">
            <label class="form-label">{{ form.password1.label }} <span class="text-danger">*</span></label>
            <input type="password" name="password1" id="password1" class="form-control" placeholder="Contraseña">
            <div class="invalid-feedback"></div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="col-md-6">
            <label class="form-label">{{ form.password2.label }} <span class="text-danger">*</span></label>
            <input type="password" name="password2" id="password2" class="form-control" placeholder="Confirmar contraseña">
            <div class="invalid-feedback"></div>
        </div>

        <!-- Rol -->
        <div class="col-md-6">
            <label class="form-label">{{ form.rol.label }} <span class="text-danger">*</span></label>
            <select name="rol" id="rol" class="form-control">
                <option value="">Seleccione...</option>
                <option value="Administrador">Administrador</option>
                <option value="Auxiliar">Auxiliar</option>
                <option value="Colaborador">Colaborador</option>
            </select>
            <div class="invalid-feedback"></div>
        </div>

        <!-- Teléfono -->
        <div class="col-md-6">
            <label class="form-label">{{ form.telefono.label }}</label>
            <input type="text" name="telefono" id="telefono" class="form-control" placeholder="Teléfono (opcional)" inputmode="numeric" pattern="[0-9]+">
            <div class="invalid-feedback"></div>
        </div>
        
        <!-- Foto de Perfil -->
        <div class="col-12">
            <label class="form-label">{{ form.foto_perfil.label }}</label>
            <div class="d-flex align-items-center gap-3">
                <div id="preview-foto-container" style="width: 100px; height: 100px; border: 2px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f8f9fa;">
                    <i class="bi bi-person-circle" style="font-size: 3rem; color: #adb5bd;"></i>
                    <img id="preview-foto" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="flex-grow-1">
                    <input type="file" name="foto_perfil" id="foto_perfil" class="form-control" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif">
                    <small class="text-muted d-block mt-1">
                        Formatos aceptados: JPG, PNG, GIF. Tamaño máximo: 5MB
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones -->
    <div class="mt-4 text-end">
        <button type="button" class="btn btn-secondary me-2" data-usuario-action="close-create">
            <i class="bi bi-x-circle"></i> Cancelar
        </button>
        <button type="submit" 
                id="btnGuardarUsuario" 
                class="btn" 
                style="background-color: #4b2f2a; color: #ffffff; border: none;"
                onmouseover="this.style.backgroundColor='#3a2117'"
                onmouseout="this.style.backgroundColor='#4b2f2a'">
            <i class="bi bi-save"></i> Guardar
        </button>
    </div>
</form>
